name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  e2e-smoke:
    runs-on: ubuntu-latest
    env:
      # .env is gitignored and never present in CI. Without it,
      # VITE_UPLOAD_WORKER_URL falls back to the "localhost" default in
      # src/config.js, which flips src/lib/tracks.js's IS_DEV flag true and
      # routes every track fetch through a localStorage-only dev path —
      # bypassing both the real worker and these tests' network-level
      # page.route() mocks entirely. Set to the real worker URL (public,
      # not a secret — see worker/wrangler.toml) so IS_DEV is false and the
      # normal network path (mockable / real, matching local dev) is used.
      VITE_UPLOAD_WORKER_URL: https://psc-upload-worker.psoulc.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # public/validationSummary.json is gitignored and normally generated as
      # part of `npm run build` (see scripts/generate-validation-summary.js) —
      # the e2e-smoke job never runs a full build, so without this step the
      # file is absent and tests/e2e/validationSummary.spec.js's real-numbers
      # assertions fail (they'd only ever see the "PENDING VALIDATION" state).
      - run: node scripts/generate-validation-summary.js
      - run: npx playwright test
